<!doctype html>
<html lang="en" data-theme="deep" data-layout="left">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit — SOS Catalog concept 01</title>
<meta name="description" content="Concept 01 · Orbit. An immersive, full-bleed 3D/2D globe with floating glass panels, a command palette and a playback dock for the NOAA Science On a Sphere catalog.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--@SHARED_CSS-->
<style>
:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --panel-w:404px;--insp-w:392px;--gap:16px;--top:72px;
  --inset-l:0px;--inset-r:0px;--inset-b:0px;
}
/* ---------- themes ---------- */
html[data-theme="deep"]{
  color-scheme:dark;
  --bg:#04060d;--bg2:#0b1738;--panel:rgba(11,17,34,.7);--panel-solid:#0d1429;--hi:rgba(255,255,255,.055);--hi2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.16);--text:#eaf0ff;--muted:#a5b2d1;--faint:#7584a9;
  --accent:#55c8ff;--accent2:#8f9bff;--accent-soft:rgba(85,200,255,.15);--accent-line:rgba(85,200,255,.5);--accent-ink:#00192a;
  --shadow:0 30px 70px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset;--mark-bg:rgba(85,200,255,.28);--toast-bg:#eaf0ff;--toast-fg:#0a1022;--focus:#7dd7ff;
  --g-style:photo;--g-atmo:#58aaff;--g-atmo-a:.95;--g-stars:.85;--g-light:head;--g-text:#eaf4ff;--g-halo:rgba(2,8,24,.72);--g-accent:#8fe0ff;
  --g-exposure:1;--g-sat:1.05;--g-grid:#9fd8ff;--g-grid-a:0;
}
html[data-theme="aurora"]{
  color-scheme:dark;
  --bg:#07050f;--bg2:#1a0f3a;--panel:rgba(20,12,40,.66);--panel-solid:#150c2b;--hi:rgba(255,255,255,.06);--hi2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);--text:#f1ecff;--muted:#b6aad8;--faint:#8b7db7;
  --accent:#6af0c4;--accent2:#b58bff;--accent-soft:rgba(106,240,196,.14);--accent-line:rgba(106,240,196,.5);--accent-ink:#02231a;
  --shadow:0 30px 70px -10px rgba(5,0,20,.7),0 0 0 1px rgba(255,255,255,.02) inset;--mark-bg:rgba(106,240,196,.25);--toast-bg:#f1ecff;--toast-fg:#150c2b;--focus:#8ff5d6;
  --g-style:dots;--g-ocean:#0c0720;--g-ocean2:#2a1a5e;--g-land:#7ff0cd;--g-land2:#b58bff;--g-atmo:#9a6bff;--g-atmo-a:.9;--g-stars:.8;--g-light:none;--g-text:#f6f0ff;--g-halo:rgba(10,4,30,.75);--g-accent:#9af7d9;--g-grid:#9a6bff;--g-grid-a:.0;
}
html[data-theme="frost"]{
  color-scheme:light;
  --bg:#dfe8f2;--bg2:#f6f9fd;--panel:rgba(255,255,255,.74);--panel-solid:#ffffff;--hi:rgba(14,34,64,.045);--hi2:rgba(14,34,64,.08);
  --line:rgba(14,34,64,.1);--line2:rgba(14,34,64,.2);--text:#0d1b33;--muted:#4a5a78;--faint:#596781;
  --accent:#0b5ed7;--accent2:#6a4dff;--accent-soft:rgba(11,94,215,.11);--accent-line:rgba(11,94,215,.45);--accent-ink:#ffffff;
  --shadow:0 24px 60px -12px rgba(30,60,110,.28),0 0 0 1px rgba(255,255,255,.6) inset;--mark-bg:rgba(255,196,0,.35);--toast-bg:#0d1b33;--toast-fg:#fff;--focus:#0b5ed7;
  --g-style:flat;--g-ocean:#cfe0f0;--g-ocean2:#a9c6e2;--g-land:#f2ede2;--g-land2:#d9d0bd;--g-coast:#7a8aa3;--g-coast-a:.85;--g-grid:#7a8aa3;--g-grid-a:.2;--g-atmo:#8db8ff;--g-atmo-a:.5;--g-stars:0;--g-light:none;--g-text:#12223d;--g-halo:rgba(255,255,255,.85);--g-accent:#0b5ed7;
}
/* ---------- base ---------- */
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:13px;line-height:1.45;color:var(--text);background:var(--bg)}
.stage{position:fixed;inset:0;background:radial-gradient(1100px 760px at 62% 42%,var(--bg2),var(--bg) 72%)}
.stage .sosglobe{position:absolute;inset:0}
::selection{background:var(--accent-soft)}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow)}
.kbd{font:500 11px/1 var(--mono);padding:3px 6px;border-radius:6px;background:var(--hi2);color:var(--muted);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{color:inherit}
.btn,.icon-btn,.chip,.seg button,.row,.pill{transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease)}

/* ---------- top bar ---------- */
.topbar{position:fixed;z-index:30;left:var(--gap);right:var(--gap);top:14px;height:46px;display:flex;align-items:center;gap:12px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 8px;border-radius:999px;text-decoration:none}
.brand-mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#bff0ff,var(--accent) 45%,#0b3a8f);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 6px 16px -4px var(--accent);position:relative}
.brand-mark::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent-line);transform:rotate(-24deg) scaleY(.38);}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand i{font-style:normal;font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1.2}
.search-trigger{flex:1;max-width:460px;height:46px;display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;border-radius:999px;color:var(--muted);text-align:left;margin-inline:auto}
.search-trigger:hover{border-color:var(--line2);color:var(--text)}
.search-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;height:46px;padding:0 6px;border-radius:999px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--hi);border:1px solid var(--line)}
.seg button{height:30px;min-width:46px;padding:0 12px;border-radius:999px;font-weight:600;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button.is-on{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 10px -2px var(--accent)}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hi2);color:var(--text)}
.icon-btn.is-on{background:var(--accent-soft);color:var(--accent)}
.badge{position:absolute;top:-2px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 10px/17px var(--font);text-align:center}
.badge:empty,.badge[data-n="0"]{display:none}

/* ---------- browse panel ---------- */
.panel{position:fixed;z-index:20;left:var(--gap);top:var(--top);bottom:var(--gap);width:var(--panel-w);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;transition:transform .45s var(--ease),opacity .3s}
.panel-head{padding:16px 16px 12px;display:grid;gap:12px;flex:none;align-content:start}
.panel-title{display:flex;align-items:baseline;gap:10px}
.panel-title h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.panel-title .count{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.panel-title .grow{flex:1}
.field{position:relative;display:flex;align-items:center}
.field .ic{position:absolute;left:13px;color:var(--faint);pointer-events:none}
.field input{width:100%;height:42px;padding:0 38px 0 40px;border-radius:14px;border:1px solid var(--line);background:var(--hi);color:var(--text);outline:none}
.field input::placeholder{color:var(--faint)}
.field input:hover{border-color:var(--line2)}
.field input:focus{border-color:var(--accent-line);background:var(--hi2);box-shadow:0 0 0 4px var(--accent-soft)}
.field .clear{position:absolute;right:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.field .clear:hover{background:var(--hi2);color:var(--text)}
.field input[type=search]::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 22px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--hi);color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--text);background:var(--hi2)}
.chip .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip.is-on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.chip.is-on .n{color:var(--accent)}
.chip[disabled]{opacity:.4;pointer-events:none}
.toolbar{display:flex;align-items:center;gap:8px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--hi);font-weight:600;font-size:12.5px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hi2);border-color:var(--line2)}
.btn.is-on{background:var(--accent-soft);border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 20px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:transparent}
.btn .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/18px var(--font);text-align:center}
.toolbar .grow{flex:1}
.select{position:relative;display:inline-flex;align-items:center}
.select select{appearance:none;-webkit-appearance:none;height:34px;padding:0 32px 0 12px;border-radius:11px;border:1px solid var(--line);background:var(--hi);color:var(--text);font-weight:600;font-size:12.5px;cursor:pointer;outline:none}
.select select:hover{background:var(--hi2);border-color:var(--line2)}
.select select option{background:var(--panel-solid);color:var(--text)}
.select .ic{position:absolute;right:10px;pointer-events:none;color:var(--faint)}

.filters{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease);flex:0 1 auto;min-height:0}
.filters.is-open{grid-template-rows:1fr;max-height:50%;border-top:1px solid var(--line)}
.filters>div{overflow:hidden;min-height:0}
.filters.is-open>div{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
.filters-inner{display:grid;gap:14px;padding:14px 16px 16px}
.fgroup h3{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;display:flex;justify-content:space-between}
.fgroup .wrap{display:flex;flex-wrap:wrap;gap:6px}
.chip.sm{height:28px;font-size:12px;padding:0 10px}
.histo{position:relative;height:54px;margin:2px 0 0}
.histo .bars{position:absolute;inset:0 0 18px;display:flex;align-items:flex-end;gap:3px}
.histo .bars i{flex:1;min-height:2px;border-radius:3px 3px 0 0;background:var(--hi2);transition:background .2s,height .3s var(--ease)}
.histo .bars i.in{background:var(--accent)}
.histo .axis{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--faint)}
.range{position:relative;height:22px;margin-top:-4px}
.range input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--panel-solid);box-shadow:0 0 0 1px var(--accent-line);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--panel-solid);cursor:grab}
.range input::-webkit-slider-runnable-track{background:transparent}
.range .track{position:absolute;left:8px;right:8px;top:10px;height:2px;background:var(--hi2);border-radius:2px}
.range .fill{position:absolute;top:10px;height:2px;background:var(--accent);border-radius:2px}

.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.active:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12px;font-weight:500}
.tag button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.tag button:hover{background:var(--accent);color:var(--accent-ink)}
.link{font-size:12px;font-weight:600;color:var(--accent);padding:4px 6px;border-radius:6px}
.link:hover{text-decoration:underline}

.list-wrap{flex:1;min-height:0;position:relative;border-top:1px solid var(--line)}
.list{height:100%;overflow:auto;padding:8px 8px 16px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px;width:100%;padding-right:10px;border-radius:16px;border:1px solid transparent;content-visibility:auto;contain-intrinsic-size:auto 78px;position:relative}
.row-main{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:12px;min-width:0;padding:10px;border-radius:16px;text-align:left;width:100%}
.row:hover{background:var(--hi)}
.row.is-sel{background:linear-gradient(90deg,var(--accent-soft),transparent 90%);border-color:var(--accent-line)}
.row .thumb{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 8px 18px -8px rgba(0,0,0,.6);background-color:#000}
.row .thumb img{object-fit:cover;transform:scale(1.02)}
.row .info{min-width:0;display:grid;gap:4px}
.row .name{font-weight:600;font-size:13.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.005em}
.row .meta{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11.5px;min-width:0;white-space:nowrap}
.row .meta .cat{display:inline-flex;align-items:center;gap:6px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row .meta .cat i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.row .meta .ic{color:var(--accent)}
.row .add{opacity:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);transition:opacity .15s,background .15s}
.row:hover .add,.row:focus-within .add,.row .add.is-on,.row .add:focus-visible{opacity:1}
.row .add:hover{background:var(--hi2);color:var(--text)}
.row .add.is-on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.empty{display:grid;place-items:center;text-align:center;padding:48px 24px;gap:10px;color:var(--muted)}
.empty .ic{color:var(--faint)}
.empty h3{color:var(--text);font-size:15px}
.more-sentinel{height:1px}
.skeleton{height:60px;border-radius:16px;margin:8px;background:linear-gradient(90deg,var(--hi) 25%,var(--hi2) 37%,var(--hi) 63%);background-size:400% 100%;animation:sos-shimmer 2.2s linear infinite}

/* ---------- inspector ---------- */
.inspector{position:fixed;z-index:21;right:var(--gap);top:var(--top);bottom:var(--gap);width:var(--insp-w);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 32px));opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .3s}
.inspector.is-open{transform:none;opacity:1;pointer-events:auto}
.insp-scroll{overflow:auto;flex:1;padding:0 0 18px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.insp-hero{position:relative;margin:12px 12px 0;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#000 center/cover}
.insp-hero .thumb{position:absolute;inset:0}
.insp-hero .thumb img{object-fit:contain;background:#000}
.insp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.insp-close{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.45);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.insp-close:hover{background:rgba(0,0,0,.7);color:#fff}
.insp-body{padding:16px 18px 0;display:grid;gap:16px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c,var(--accent)) 72%,var(--text))}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 10px var(--c,var(--accent))}
.insp-body h2{font-size:22px;line-height:1.18;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--hi2);color:var(--muted);font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.pill.accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.pill .ic{color:var(--accent)}
.desc{color:var(--muted);font-size:13.5px;line-height:1.6}
.desc .more{display:none}.desc.is-open .more{display:inline}.desc.is-open .ell{display:none}
.desc button{color:var(--accent);font-weight:600;margin-left:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{height:38px;padding:0 15px;border-radius:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:12.5px;padding:14px;border-radius:16px;background:var(--hi);border:1px solid var(--line)}
.kv dt{color:var(--faint);font-weight:500}
.kv dd{color:var(--text);font-weight:500;min-width:0}
.kv .chips-inline{display:flex;flex-wrap:wrap;gap:5px}
.kv .chips-inline button{height:22px;padding:0 8px;border-radius:6px;background:var(--hi2);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.kv .chips-inline button:hover{color:var(--text);border-color:var(--accent-line)}
.insp-sec h3{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{display:grid;gap:7px;text-align:left}
.mini .thumb{aspect-ratio:1;border-radius:14px;box-shadow:0 0 0 1px var(--line);background-color:#000}
.mini span{font-size:11.5px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini:hover span{color:var(--text)}
.mini:hover .thumb{box-shadow:0 0 0 2px var(--accent-line)}
.ngss{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:25;bottom:var(--gap);left:calc(var(--inset-l) + var(--gap));right:calc(var(--inset-r) + var(--gap));margin-inline:auto;width:min(780px,calc(100vw - var(--inset-l) - var(--inset-r) - 32px));border-radius:22px;display:flex;align-items:center;gap:14px;padding:10px 14px;transition:left .45s var(--ease),right .45s var(--ease),transform .4s var(--ease),opacity .3s}
.dock.is-compact{width:fit-content;padding:8px}
.dock .play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--accent)}
.dock .play:hover{transform:scale(1.06)}

.dock .legend{flex:1;min-width:150px;display:grid;gap:5px}

.dock.is-narrow .legend,.dock.is-narrow .opacity,.dock.is-narrow .sep{display:none}

.legend-block{display:grid;gap:6px;padding:14px;border-radius:16px;background:var(--hi);border:1px solid var(--line)}

.legend-block .ticks{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--faint)}
.legend-block small{color:var(--faint);font-size:11px;line-height:1.45;margin-top:2px}

/* ---------- misc floating ---------- */
.readout{position:fixed;z-index:15;right:calc(var(--inset-r) + 18px);bottom:calc(var(--gap) + 74px);font:500 11px var(--mono);color:var(--muted);text-align:right;pointer-events:none;text-shadow:0 1px 8px var(--bg);opacity:0;transition:opacity .2s}

.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s var(--ease),background .2s}

html[data-layout="bottom"] .rail{top:auto;bottom:var(--gap);flex-direction:row;width:auto}

/* ---------- responsive ---------- */

}

  .panel,html[data-layout] .panel{left:var(--gap);right:var(--gap);width:auto;top:auto;bottom:var(--gap);height:min(58vh,520px);display:flex;border-radius:22px 22px 18px 18px;overflow:hidden}
  html[data-layout] .panel-head{display:grid;grid-template-columns:none;gap:10px;padding:12px 12px 8px}
  html[data-layout] .panel-title .grow,html[data-layout] #btnCollapse{display:block}

  html[data-layout] .list{display:block;overflow-y:auto;overflow-x:hidden;padding:8px}
  html[data-layout] .row{flex:none;display:grid;grid-template-columns:1fr auto;border:1px solid transparent;background:none;padding:0 6px 0 0;align-items:center;content-visibility:auto}
  html[data-layout] .row-main{grid-template-columns:56px 1fr;grid-template-rows:auto;padding:10px;height:auto}
  html[data-layout] .row .thumb{width:56px;height:56px;aspect-ratio:auto;border-radius:50%}
  html[data-layout] .row .add{position:static;background:transparent;color:var(--muted);border-color:var(--line);opacity:1}
  .panel.is-peek{height:176px}
  .panel.is-peek .list-wrap,.panel.is-peek .filters,.panel.is-peek .toolbar{display:none}

  .readout,.credit{display:none}

<body>
<div class="stage" id="stage" role="img" aria-label="Interactive globe"></div>

<script>
(function () {
  'use strict';
  const { store, ui, esc, clamp } = SOS;
  const { icon } = ui;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const html = document.documentElement;
  const mq = (q) => window.matchMedia(q).matches;
  const isMobile = () => mq('(max-width:760px)');
  document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = icon(el.dataset.icon, +el.dataset.size || 18); });

  /* ---------- state ---------- */
  const app = SOS.createApp({ sort: 'az' });
  const prefs = ui.persist('sos.orbit.prefs', { theme: 'deep', layout: 'left', rotate: true, labels: true });
  const P = prefs.get();
  const themeSw = ui.themeSwitcher({ key: 'orbit.theme', themes: [{ id: 'deep' }, { id: 'aurora' }, { id: 'frost' }] });
  const qLayout = new URLSearchParams(location.search).get('layout');
  html.setAttribute('data-layout', ['left', 'right', 'bottom'].includes(qLayout) ? qLayout : (P.layout || 'left'));
  let shown = 60, panelCollapsed = false, filtersOpen = false, peek = false;

  /* ---------- globe ---------- */
  const g = new SOS.Globe($('#stage'), {
    lon: -40, lat: 24, zoom: 1, autoRotate: P.rotate ? 3 : 0, labels: P.labels,
    onView: (v) => {}, onHover: (h) => { const el = $('#readout'); if (h) { el.textContent = `${Math.abs(h.lat).toFixed(1)}°${h.lat >= 0 ? 'N' : 'S'}  ${Math.abs(h.lon).toFixed(1)}°${h.lon >= 0 ? 'E' : 'W'}`; el.classList.add('is-on'); } else el.classList.remove('is-on'); },
  });
  g.themeFromCSS(html);

  function updateInsets() {
    const layout = html.getAttribute('data-layout');

    if (e.target.closest('#zOut')) return g.zoomBy(1 / 1.4);
    if (e.target.closest('#zReset')) return g.resetView();
    const sp = e.target.closest('#spin'); if (sp) { P.rotate = !P.rotate; prefs.set(P); g.setAutoRotate(P.rotate ? 3 : 0); sp.classList.toggle('is-on', P.rotate); sp.setAttribute('aria-pressed', P.rotate); }
  });
  dock.addEventListener('input', (e) => {
    if (e.target.id === 'scrub') { const t = +e.target.value / 1000; e.target.style.setProperty('--p', t * 100 + '%'); app.set({ t, playing: false }); g.play(false); const d = app.selected; if (d) $('#tLabel').textContent = SOS.describe(d).time.label(t); const pb = $('#play'); if (pb) pb.innerHTML = icon('play', 20); }
    if (e.target.id === 'opac') { const v = +e.target.value / 100; e.target.style.setProperty('--p', v * 100 + '%'); app.set({ opacity: v }); }
  });
  dock.addEventListener('change', (e) => { if (e.target.id === 'proj') app.set({ proj: e.target.value }); });

  /* ---------- panel collapse / mobile sheet ---------- */
  function togglePanel(collapse) {
    panelCollapsed = collapse; document.body.classList.toggle('panel-collapsed', collapse); updateInsets();
    $('#btnCollapse').setAttribute('aria-expanded', !collapse);
  }
  $('#btnCollapse').addEventListener('click', () => togglePanel(true));
  $('#btnExpand').addEventListener('click', () => togglePanel(false));
  $('#btnRailSearch').addEventListener('click', () => { togglePanel(false); setTimeout(() => qEl.focus(), 350); });
  const grab = $('#grab');
  const grabToggle = () => { if (panelCollapsed) { togglePanel(false); peek = false; } else { peek = !peek; } $('#panel').classList.toggle('is-peek', peek); updateInsets(); };
  grab.addEventListener('click', grabToggle);
  grab.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); grabToggle(); } });

  /* ---------- popovers: playlist + appearance ---------- */
  function placePop(pop, anchor) {
    const r = anchor.getBoundingClientRect();
    pop.style.top = r.bottom + 10 + 'px';
    pop.style.right = Math.max(10, innerWidth - r.right - 4) + 'px';
    pop.style.left = 'auto';
  }
  let openPop = null;
  function togglePop(pop, anchor, on) {
    const show = on != null ? on : !pop.classList.contains('is-open');
    [$('#popPlaylist'), $('#popLook')].forEach((p) => p.classList.remove('is-open'));
    $('#btnPlaylist').classList.remove('is-on'); $('#btnLook').classList.remove('is-on');
    openPop = null;
    if (show) { placePop(pop, anchor); pop.classList.add('is-open'); anchor.classList.add('is-on'); openPop = pop; }
  }
  $('#btnPlaylist').addEventListener('click', (e) => { e.stopPropagation(); renderPlaylist(); togglePop($('#popPlaylist'), $('#btnPlaylist')); });
  $('#btnLook').addEventListener('click', (e) => { e.stopPropagation(); renderLook(); togglePop($('#popLook'), $('#btnLook')); });
  document.addEventListener('click', (e) => { if (openPop && !openPop.contains(e.target)) togglePop(openPop, null, false); });
  function renderPlaylist() {
    const items = store.playlist.items;
    $('#popPlaylist').innerHTML = `<div><h4>My playlist · ${items.length}</h4>${items.length ? `<div class="pl-list">${items.map((d) => `<div class="pl-item" data-id="${d.id}" role="button" tabindex="0">${ui.thumb(d, { size: 'small' })}<span>${esc(d.name)}</span><button class="rm" data-rm="${d.id}" aria-label="Remove ${esc(d.name)}">${icon('x', 14)}</button></div>`).join('')}</div>` : `<p style="color:var(--muted);line-height:1.55">Add datasets with the <b>+</b> button to build a playlist for a presentation or lesson.</p>`}</div>${items.length ? `<button class="btn" id="plClear">Clear playlist</button>` : ''}`;
  }
  $('#popPlaylist').addEventListener('click', (e) => {
    const rm = e.target.closest('.rm'); if (rm) { e.stopPropagation(); return store.playlist.remove(+rm.dataset.rm); }
    if (e.target.closest('#plClear')) return store.playlist.clear();
    const it = e.target.closest('.pl-item'); if (it) { app.select(+it.dataset.id); togglePop(openPop, null, false); }
  });
  function renderLook() {
    const L = html.getAttribute('data-layout'), T = html.getAttribute('data-theme');
    const sw = [['deep', 'Deep space', 'radial-gradient(circle at 35% 30%,#7dd9ff,#0b2a6b 60%,#04060d)'], ['aurora', 'Aurora', 'radial-gradient(circle at 35% 30%,#b58bff,#2a1a5e 55%,#6af0c4)'], ['frost', 'Frost', 'radial-gradient(circle at 35% 30%,#ffffff,#cfe0f0 55%,#9ab6d6)']];
    $('#popLook').innerHTML = `<div><h4>Theme</h4><div class="swatches">${sw.map(([id, n, bg]) => `<button class="swatch ${T === id ? 'is-on' : ''}" data-theme-pick="${id}" aria-pressed="${T === id}"><i style="background:${bg}"></i>${n}</button>`).join('')}</div></div>
      <div><h4>Layout</h4><div class="swatches">${[['left', 'Dock left', 'panel'], ['right', 'Dock right', 'panelr'], ['bottom', 'Shelf', 'paneb']].map(([id, n, ic]) => `<button class="swatch ${L === id ? 'is-on' : ''}" data-layout-pick="${id}" aria-pressed="${L === id}"><span style="height:34px;display:grid;place-items:center">${icon(ic, 26)}</span>${n}</button>`).join('')}</div></div>
      <div><div class="toggle-row"><span>Slowly rotate globe</span><button class="switch" role="switch" data-sw="rotate" aria-checked="${!!P.rotate}" aria-label="Auto-rotate"></button></div>
      <div class="toggle-row" style="margin-top:10px"><span>City labels</span><button class="switch" role="switch" data-sw="labels" aria-checked="${!!P.labels}" aria-label="City labels"></button></div></div>`;
  }
  $('#popLook').addEventListener('click', (e) => {
    const t = e.target.closest('[data-theme-pick]');
    if (t) { themeSw.apply(t.dataset.themePick); g.themeFromCSS(html); P.theme = t.dataset.themePick; prefs.set(P); renderLook(); return; }
    const l = e.target.closest('[data-layout-pick]');
    if (l) { html.setAttribute('data-layout', l.dataset.layoutPick); P.layout = l.dataset.layoutPick; prefs.set(P); autoCollapsed = false; togglePanel(false); renderLook(); return; }
    const s = e.target.closest('[data-sw]');
    if (s) { const k = s.dataset.sw; P[k] = !P[k]; prefs.set(P); if (k === 'rotate') { g.setAutoRotate(P.rotate ? 3 : 0); renderDock(); } else g.setLabels(P.labels); renderLook(); }
  });

  /* ---------- command palette ---------- */
  const cmdk = $('#cmdk'), cin = $('#cmdkIn'), cres = $('#cmdkRes');
  let cItems = [], cAct = 0;
  function openCmd(prefill = '') { cmdk.classList.add('is-open'); cin.value = prefill; renderCmd(); setTimeout(() => { cin.focus(); cin.select(); }, 30); }
  function closeCmd() { cmdk.classList.remove('is-open'); }
  function renderCmd() {
    const q = cin.value.trim();
    let out = '', idx = 0; cItems = [];
    const add = (o) => { cItems.push(o); return idx++; };
    const sec = (t) => (out += `<div class="cmdk-sec">${t}</div>`);
    if (!q) {
      const rt = store.all.filter((d) => d.rt).slice(0, 4), news = store.all.slice().sort((a, b) => b.addedTs - a.addedTs).slice(0, 4);
      sec('Jump to a category'); store.cats.forEach((c) => { const m = store.CAT_META[c]; const i = add({ type: 'cat', v: c }); out += `<button class="cmdk-item" role="option" data-i="${i}"><span class="ico" style="color:${m.color}">${icon(m.icon, 18)}</span><span><div class="t">${esc(c)}</div><div class="s">${esc(m.blurb)}</div></span><span class="go">${store.catCount[c]}</span></button>`; });
      sec('Real-time now'); rt.forEach((d) => { const i = add({ type: 'ds', v: d.id }); out += cmdRow(d, i); });
      sec('Recently added'); news.forEach((d) => { const i = add({ type: 'ds', v: d.id }); out += cmdRow(d, i); });
    } else {
      const s = store.suggest(q, 8);
      if (s.cats.length) { sec('Categories'); s.cats.forEach((c) => { const m = store.CAT_META[c]; const i = add({ type: 'cat', v: c }); out += `<button class="cmdk-item" role="option" data-i="${i}"><span class="ico" style="color:${m.color}">${icon(m.icon, 18)}</span><span><div class="t">${esc(c)}</div><div class="s">Filter by category</div></span><span class="go">${store.catCount[c]}</span></button>`; }); }
      if (s.datasets.length) { sec(`Datasets · ${s.total}`); s.datasets.forEach((d) => { const i = add({ type: 'ds', v: d.id }); out += cmdRow(d, i, store.tokenize(q)); }); }
      if (s.keywords.length) { sec('Keywords'); s.keywords.forEach((k) => { const i = add({ type: 'kw', v: k.name }); out += `<button class="cmdk-item" role="option" data-i="${i}"><span class="ico">${icon('hash', 17)}</span><span><div class="t">${esc(k.name)}</div><div class="s">Search by keyword</div></span><span class="go">${k.count}</span></button>`; }); }
      if (!cItems.length) out = `<div class="empty">${icon('search', 30)}<h3>Nothing found for “${esc(q)}”</h3><p>Try a topic like “hurricane”, “sea ice” or “Mars”.</p></div>`;
    }
    cres.innerHTML = out; cAct = 0; markCmd();
  }
  const cmdRow = (d, i, tokens) => `<button class="cmdk-item" role="option" data-i="${i}">${ui.thumb(d, { size: 'small' })}<span style="min-width:0"><div class="t">${store.highlight(d.name, tokens)}</div><div class="s">${esc(d.cat)}${d.subs[0] ? ' · ' + esc(d.subs[0]) : ''}${d.rt ? ' · Real-time' : ''}</div></span><span class="go">${d.sos && d.sosx ? 'SOS · Explorer' : d.sos ? 'SOS' : 'Explorer'}</span></button>`;
  function markCmd() { $$('.cmdk-item', cres).forEach((el, i) => el.classList.toggle('is-act', i === cAct)); const a = $$('.cmdk-item', cres)[cAct]; if (a) a.scrollIntoView({ block: 'nearest' }); }
  function runCmd(i, shift) {
    const it = cItems[i]; if (!it) return;
    closeCmd();
    if (it.type === 'ds') { if (shift) { qEl.value = store.byId.get(it.v).name; app.set({ q: qEl.value, sort: 'rel' }); } app.select(it.v); if (panelCollapsed && !isMobile()) { /* keep globe in focus */ } }
    if (it.type === 'cat') { app.set({ cats: [it.v], q: '' }); qEl.value = ''; togglePanel(false); }
    if (it.type === 'kw') { qEl.value = it.v; app.set({ q: it.v, sort: 'rel' }); togglePanel(false); }
  }
  cin.addEventListener('input', renderCmd);
  cmdk.addEventListener('click', (e) => { if (e.target === cmdk) return closeCmd(); const it = e.target.closest('.cmdk-item'); if (it) runCmd(+it.dataset.i, e.shiftKey); });
  cin.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); cAct = Math.min(cItems.length - 1, cAct + 1); markCmd(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cAct = Math.max(0, cAct - 1); markCmd(); }
    else if (e.key === 'Enter') { e.preventDefault(); runCmd(cAct, e.shiftKey); }
  });
  $('#searchTrigger').addEventListener('click', () => openCmd());
  document.addEventListener('keydown', (e) => {
    const inField = /input|textarea|select/i.test(e.target.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk.classList.contains('is-open') ? closeCmd() : openCmd(); }
    else if (e.key === '/' && !inField) { e.preventDefault(); openCmd(); }
    else if (e.key === 'Escape') { if (cmdk.classList.contains('is-open')) closeCmd(); else if (openPop) togglePop(openPop, null, false); else if (app.state.sel != null) app.select(null); }
  });
  $('#brand').addEventListener('click', (e) => { e.preventDefault(); app.clear(); app.select(null); qEl.value = ''; g.resetView(); });
  window.addEventListener('resize', SOS.debounce(updateInsets, 80));

  /* ---------- boot ---------- */
  let autoCollapsed = false;
  SOS.bindGlobe(app, g, {
    onDataset: (d, info) => {
      renderInspector(d, info);
      // on narrower desktops give the globe room: tuck the browser into its rail while a dataset is open
      if (d && isMobile() && !panelCollapsed) { autoCollapsed = true; togglePanel(true); }
      else if (d && !isMobile() && innerWidth < 1380 && !panelCollapsed && html.getAttribute('data-layout') !== 'bottom') { autoCollapsed = true; togglePanel(true); }
      else if (!d && autoCollapsed) { autoCollapsed = false; togglePanel(false); }
      renderDock(); updateInsets();
    },
    onTime: () => syncTime(), onMode: syncMode,
  });
  renderBrowse();
  syncMode();
  renderDock();
  renderPlaylist();
  $('#plBadge').textContent = store.playlist.size || ''; $('#plBadge').dataset.n = store.playlist.size;
  const fromHash = app.selectFromHash();
  if (fromHash) { app.state.sel = null; app.select(fromHash.id, { noHash: true }); }
  window.__orbit = { app, g };
})();
</script>
</body>
</html>
