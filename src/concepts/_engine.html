<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engine test</title>
<!--@SHARED_CSS-->
<style>
  :root{--g-style:photo;--g-atmo:#5aa8ff;--g-atmo-a:.9;--g-stars:.9;--g-light:head;--g-ocean:#0b2a5b;--g-ocean2:#06142e;--g-land:#2d6a4f;--g-land2:#9fc98a;--g-coast:#ffffff;--g-coast-a:.0;--g-grid:#fff;--g-grid-a:0;--g-text:#fff;--g-halo:rgba(0,0,0,.6);--g-accent:#fff}
  html,body{height:100%;background:#05070f;color:#e6ecff;font:13px/1.4 system-ui,Segoe UI,sans-serif}
  #stage{position:fixed;inset:0}
  .bar{position:fixed;left:12px;top:12px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100vw - 24px);align-items:center;background:rgba(10,14,26,.78);backdrop-filter:blur(10px);padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:12px}
  .bar select,.bar button,.bar input{background:#141b30;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:5px 8px;color:inherit}
  .bar label{display:flex;gap:6px;align-items:center;opacity:.9}
  .ro{position:fixed;left:12px;bottom:12px;z-index:5;background:rgba(10,14,26,.78);padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);font:12px ui-monospace,Consolas,monospace}
  #icons{position:fixed;right:12px;top:12px;z-index:5;display:none;grid-template-columns:repeat(10,36px);gap:6px;background:rgba(10,14,26,.9);padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
  #icons span{display:grid;place-items:center;height:36px;border-radius:8px;background:#141b30}
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <label>Layer <select id="kind"></select></label>
  <label>Mode <select id="mode"><option value="3d">3D</option><option value="2d">2D</option></select></label>
  <label>Proj <select id="proj"><option>equirect</option><option>natural</option><option>mercator</option></select></label>
  <label>Style <select id="style"><option>photo</option><option>flat</option><option>duo</option><option>dots</option></select></label>
  <label>t <input id="t" type="range" min="0" max="1" step="0.001" value="0.3"></label>
  <button id="play">Play</button>
  <button id="icbtn">Icons</button>
</div>
<div class="ro" id="ro">–</div>
<div id="icons"></div>
<!--@SHARED_JS-->
<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const G = window.G = new SOS.Globe($('#stage'), {
    lon: -30, lat: 22, zoom: 1, autoRotate: 0, wrap: params.get('wrap') !== '0',
    onView: (v)=>{ $('#ro').textContent = `lon ${v.lon.toFixed(1)}  lat ${v.lat.toFixed(1)}  zoom ${v.zoom.toFixed(2)}  ${v.mode} (${v.morph.toFixed(2)})`; },
    onHover: (h)=>{ if(h) $('#ro').textContent = `cursor ${h.lon.toFixed(2)}, ${h.lat.toFixed(2)}`; },
  });
  G.themeFromCSS(document.documentElement);
  // kinds menu
  const kinds = Object.keys(SOS.layers.LAYERS).map(k=>['L:'+k, k]);
  const bodies = Object.keys(SOS.layers.BODIES).map(k=>['body:'+k, 'body: '+k]).concat(['sky:cmb','sky:milky'].map(k=>[k,k]));
  const sel = $('#kind');
  [...kinds, ...bodies].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; sel.appendChild(o); });
  function pick(v){
    const kind = v.startsWith('L:') ? v.slice(2) : v;
    const d = SOS.store.all.find(x=>x.kind===kind) || {kind, name: kind, slug: kind, cat:'Extras', kw:[]};
    G.setDataset(Object.assign({}, d, {kind}), {fly:true});
  }
  sel.onchange = ()=>pick(sel.value);
  $('#mode').onchange = (e)=>G.setMode(e.target.value);
  $('#proj').onchange = (e)=>G.setProjection(e.target.value);
  const PRESETS = {
    photo:{style:'photo'},
    flat:{style:'flat',ocean:'#0e3a6e',ocean2:'#082448',land:'#2f7d58',land2:'#b6d98b',coast:'#9ee6ff',coastAmt:.5,gridAlpha:.12},
    paper:{style:'flat',ocean:'#d9e6ef',ocean2:'#bcd3e2',land:'#f4efe4',land2:'#e4dccb',coast:'#6b7f93',coastAmt:.8,gridAlpha:.18,grid:'#6b7f93',atmoAmt:0,stars:0,light:'none',text:'#1c2733',halo:'rgba(255,255,255,.8)'},
    duo:{style:'duo',ocean:'#050b1f',ocean2:'#16306a',land:'#0c2a4a',land2:'#59d0ff',coast:'#59d0ff',coastAmt:.6,gridAlpha:.1},
    dots:{style:'dots',ocean:'#07101f',ocean2:'#1c3355',land:'#6fd0ff',gridAlpha:.0},
  };
  $('#style').onchange = (e)=>{ G.setStyle(PRESETS[e.target.value]); };
  $('#t').oninput = (e)=>G.setTime(+e.target.value);
  $('#play').onclick = ()=>{ G.play(!G.player.playing); $('#play').textContent = G.player.playing?'Pause':'Play'; };
  G.opts.onTime = (t)=>{ $('#t').value = t; };
  // icons gallery
  const ic = $('#icons');
  Object.keys(SOS.ui.icons).forEach(n=>{ const s=document.createElement('span'); s.title=n; s.innerHTML=SOS.ui.icon(n,20); ic.appendChild(s); });
  $('#icbtn').onclick = ()=>{ ic.style.display = ic.style.display==='grid'?'none':'grid'; };
  // query params for scripted screenshots: ?layer=sst&mode=2d&t=0.5
  if (params.get('layer')) { sel.value = params.get('layer').includes(':') ? params.get('layer') : 'L:'+params.get('layer'); pick(sel.value); }
  if (params.get('mode')) { $('#mode').value = params.get('mode'); G.setMode(params.get('mode'), {animate:false}); }
  if (params.get('proj')) { $('#proj').value = params.get('proj'); G.setProjection(params.get('proj')); }
  if (params.get('t')) { $('#t').value = params.get('t'); G.setTime(+params.get('t')); }
  // contact sheet: ?sheet=sst,temp,clouds&mode=3d&t=0.5&cols=4  (one mini globe per layer)
  if (params.get('sheet')) {
    G.destroy(); $('#stage').remove(); document.querySelector('.bar').style.display = 'none';
    const names = params.get('sheet').split(',');
    const cols = +(params.get('cols') || Math.ceil(Math.sqrt(names.length)));
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:fixed;inset:0;display:grid;grid-template-columns:repeat(${cols},1fr);gap:2px;background:#000`;
    document.body.appendChild(wrap);
    const mode = params.get('mode') || '3d';
    names.forEach((n)=>{
      const cell = document.createElement('div'); cell.style.cssText = 'position:relative;min-height:0;background:#05070f';
      const lab = document.createElement('div'); lab.textContent = n; lab.style.cssText = 'position:absolute;left:6px;top:4px;z-index:3;font:600 11px system-ui;color:#fff;text-shadow:0 1px 3px #000';
      cell.appendChild(lab);
      wrap.appendChild(cell);
      const g = new SOS.Globe(cell, { mode, lon: -30, lat: 22, zoom: 1, projection: params.get('proj') || 'equirect' });
      g.themeFromCSS(document.documentElement);
      if (params.get('style')) g.setStyle(PRESETS[params.get('style')]);
      const kind = n.includes(':') ? n : n;
      const base = SOS.store.all.find(x=>x.kind===kind) || {kind, name: kind, slug: kind, cat:'Extras', kw:[]};
      g.setDataset(Object.assign({}, base, {kind}), {fly:true, dur:0});
      g.setTime(+(params.get('t') || 0.5));
      if (params.get('zoom')) g.view.zoom = +params.get('zoom');
    });
  }
  console.log('[engine-test] datasets', SOS.store.all.length, 'cats', SOS.store.cats.join(','));
})();
</script>
</body>
</html>
