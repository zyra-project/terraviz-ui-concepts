<!doctype html>
<html lang="en" data-theme="indigo" data-layout="float">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Constellation — SOS Catalog concept 05</title>
<meta name="description" content="Concept 05 · Constellation. Explore the NOAA Science On a Sphere catalog as a living network: regroup 528 datasets by category, theme, year, layer or platform, then open any node on the globe.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--@SHARED_CSS-->
<style>
:root{
  --head:"Sora","Inter",system-ui,sans-serif;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--pw:312px;--iw:372px;--gap:14px;--top:68px;
}
html[data-theme="indigo"]{
  color-scheme:dark;
  --bg:#070a1c;--bg2:#101845;--panel:rgba(14,19,48,.72);--panel-solid:#0e1330;--hi:rgba(255,255,255,.06);--hi2:rgba(255,255,255,.1);--line:rgba(160,175,255,.14);--line2:rgba(160,175,255,.28);
  --text:#e9edff;--muted:#a3acd6;--faint:#6d78a8;--accent:#8f9dff;--accent2:#5de2ff;--accent-ink:#0a0f33;--shadow:0 24px 60px -16px rgba(0,0,0,.7);--mark-bg:rgba(143,157,255,.3);--toast-bg:#e9edff;--toast-fg:#0a0f33;--focus:#a9b4ff;
  --c-air:#5cc8ff;--c-water:#4a7dff;--c-land:#52e08a;--c-ice:#9be7ff;--c-space:#b88bff;--c-people:#ffa24d;--c-extras:#ff7ac3;--hub:#ffffff;--edge:150,165,255;
  --g-style:photo;--g-atmo:#6f86ff;--g-atmo-a:.9;--g-stars:.7;--g-light:head;--g-text:#fff;--g-halo:rgba(5,8,25,.7);--g-accent:#9fe9ff;
}
html[data-theme="nebula"]{
  color-scheme:dark;
  --bg:#0d0614;--bg2:#2a0f3a;--panel:rgba(32,12,44,.72);--panel-solid:#1d0b29;--hi:rgba(255,255,255,.06);--hi2:rgba(255,255,255,.1);--line:rgba(255,160,230,.15);--line2:rgba(255,160,230,.3);
  --text:#fff0fa;--muted:#cfa8c9;--faint:#8e6a8b;--accent:#ff7ac3;--accent2:#ffb347;--accent-ink:#2a0620;--shadow:0 24px 60px -16px rgba(0,0,0,.75);--mark-bg:rgba(255,122,195,.32);--toast-bg:#fff0fa;--toast-fg:#2a0620;--focus:#ff9ad2;
  --c-air:#7ad7ff;--c-water:#7b8dff;--c-land:#9be86f;--c-ice:#b8f1ff;--c-space:#d49bff;--c-people:#ffb347;--c-extras:#ff6aa8;--hub:#fff0fa;--edge:255,160,230;
  --g-style:dots;--g-ocean:#0b0412;--g-ocean2:#33134a;--g-land:#ff9fd8;--g-land2:#ffb347;--g-atmo:#ff7ac3;--g-atmo-a:.95;--g-stars:.8;--g-light:none;--g-text:#fff0fa;--g-halo:rgba(13,6,20,.8);--g-accent:#ffb347;
}
html[data-theme="chalk"]{
  color-scheme:light;
  --bg:#f3f1ea;--bg2:#fffdf7;--panel:rgba(255,254,250,.82);--panel-solid:#fffefa;--hi:rgba(30,32,48,.045);--hi2:rgba(30,32,48,.08);--line:rgba(30,32,48,.1);--line2:rgba(30,32,48,.2);
  --text:#1c2030;--muted:#555c74;--faint:#8b90a3;--accent:#3a4cff;--accent2:#e2473b;--accent-ink:#fff;--shadow:0 22px 50px -18px rgba(40,40,80,.35);--mark-bg:#ffe7a1;--toast-bg:#1c2030;--toast-fg:#fff;--focus:#3a4cff;
  --c-air:#1f8fd6;--c-water:#2549d8;--c-land:#2ea05a;--c-ice:#2fb4cf;--c-space:#7a45d6;--c-people:#e8761f;--c-extras:#d63a95;--hub:#1c2030;--edge:40,50,90;
  --g-style:flat;--g-ocean:#d9e4ee;--g-ocean2:#b9cde0;--g-land:#f7f2e4;--g-land2:#e5dcc4;--g-coast:#4c5a73;--g-coast-a:.8;--g-grid:#4c5a73;--g-grid-a:.14;--g-atmo:#9db9e8;--g-atmo-a:.4;--g-stars:0;--g-light:none;--g-text:#1c2030;--g-halo:rgba(255,254,250,.9);--g-accent:#3a4cff;
}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(1200px 800px at 55% 40%,var(--bg2),var(--bg) 70%);color:var(--text);font:13px/1.45 var(--font)}
button{color:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:var(--mark-bg)}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow)}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- top bar ---------- */
.top{position:fixed;z-index:30;left:var(--gap);right:var(--gap);top:12px;height:46px;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 10px;border-radius:999px;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px}
.brand b{font:700 15px/1 var(--head);letter-spacing:-.01em}
.brand small{display:block;font:500 10px/1.2 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.searchbar{flex:1;min-width:0;max-width:520px;height:46px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 14px/1 var(--font);color:var(--text)}
.searchbar input::placeholder{color:var(--faint)}
.searchbar .ic{color:var(--faint)}
.searchbar .hits{font:600 11.5px var(--mono);color:var(--accent);white-space:nowrap}
.searchbar .x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.searchbar .x:hover{background:var(--hi2)}
.group{display:flex;align-items:center;gap:6px;height:46px;border-radius:999px;padding:0 6px 0 14px}
.group>span{font:600 10.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.seg{display:inline-flex;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:999px;font:600 12.5px/1 var(--font);color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--text);background:var(--hi)}
.seg button.is-on{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px -4px var(--accent)}
.top .sp{flex:1}
.pill-btns{display:flex;align-items:center;gap:4px;height:46px;padding:0 6px;border-radius:999px}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hi2);color:var(--text)}
.icon-btn.is-on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.badge{position:absolute;top:-2px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 10px/17px var(--font);text-align:center}
.badge[data-n="0"]{display:none}

/* ---------- left panel ---------- */
.lpanel{position:fixed;z-index:20;left:var(--gap);top:var(--top);bottom:var(--gap);width:var(--pw);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;transition:transform .45s var(--ease),opacity .3s}
.lp-head{padding:16px 16px 12px;display:grid;gap:14px;flex:none}
.lp-head h2{font:700 13px/1 var(--head);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.lp-head h2 small{font:500 11px var(--mono);color:var(--faint)}
.legend{display:grid;gap:4px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;text-align:left;font-weight:500;color:var(--muted)}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.lg b{font:500 11px var(--mono);color:var(--faint)}
.lg:hover{background:var(--hi);color:var(--text)}
.lg.is-on{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--text)}
.lg.is-on b{color:var(--c)}
.lg.is-off{opacity:.4}
.opts{display:grid;gap:8px}
.tg{display:flex;justify-content:space-between;align-items:center;font-weight:500;color:var(--muted)}
.switch{position:relative;width:34px;height:20px;border-radius:10px;background:var(--hi2);border:1px solid var(--line2);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s var(--ease),background .2s}
.switch[aria-checked=true]{background:var(--accent);border-color:transparent}
.switch[aria-checked=true]::after{transform:translateX(14px);background:#fff}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--hi);font:600 12px/1 var(--font);color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.is-on{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--text)}
.chip[disabled]{opacity:.35;pointer-events:none}
.selw{position:relative;display:inline-flex;align-items:center}
.selw select{appearance:none;-webkit-appearance:none;height:30px;padding:0 28px 0 11px;border-radius:10px;border:1px solid var(--line);background:var(--hi);color:var(--text);font:600 12px/1 var(--font);outline:none;max-width:100%}
.selw select option{background:var(--panel-solid)}
.selw .ic{position:absolute;right:9px;pointer-events:none;color:var(--faint)}
.lp-list{flex:1;min-height:0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.lp-list h3{padding:12px 16px 8px;font:600 10.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.res{flex:1;overflow:auto;padding:0 8px 10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.ri{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;width:100%;padding:6px 8px;border-radius:12px;text-align:left}
.ri:hover{background:var(--hi)}
.ri.is-sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.ri .thumb{width:30px;height:30px;border-radius:50%;background-color:#000;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent)}
.ri span{font:500 12.5px/1.3 var(--font);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ri small{display:block;color:var(--faint);font-size:11px}
.res-empty{padding:30px 16px;color:var(--faint);text-align:center}

/* ---------- inspector ---------- */
.inspector{position:fixed;z-index:21;right:var(--gap);top:var(--top);bottom:var(--gap);width:var(--iw);border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
.ins-globe{position:relative;height:230px;flex:none;background:radial-gradient(circle at 50% 40%,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
.ins-globe .sosglobe{position:absolute;inset:0}
.ins-globe .seg{position:absolute;left:12px;top:12px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ins-globe .seg button{height:26px;padding:0 11px;font-size:11.5px}
.ins-globe .gcontrols{position:absolute;left:12px;right:12px;bottom:10px;z-index:3;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ins-globe .play{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.ins-globe .scr{flex:1;display:grid}
.ins-globe .scr .tt{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--faint)}
.ins-globe .scr .tt b{color:var(--text)}
input[type=range].sl{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range].sl::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--hi2) var(--p,0%))}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
input[type=range].sl::-moz-range-track{height:3px;background:var(--hi2)}
input[type=range].sl::-moz-range-progress{height:3px;background:var(--accent)}
input[type=range].sl::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:0}
.ins-scroll{flex:1;overflow:auto;padding:16px 18px 20px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;display:grid;gap:16px;align-content:start}
.eyebrow{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.ins-scroll h2{font:700 20px/1.2 var(--head);letter-spacing:-.015em;margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--hi2);color:var(--muted);font:600 11.5px/1 var(--font)}
.pill.acc{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text)}
.pill .ic{color:var(--accent)}
.desc{color:var(--muted);font-size:13px;line-height:1.65}
.desc button{color:var(--accent);font-weight:600;margin-left:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--hi);font:600 12.5px/1 var(--font);text-decoration:none;color:var(--text)}
.btn:hover{background:var(--hi2)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;padding:14px;border-radius:14px;background:var(--hi);border:1px solid var(--line);font-size:12.5px}
.kv dt{color:var(--faint)}.kv dd{font-weight:500;min-width:0}
.kws{display:flex;flex-wrap:wrap;gap:5px}
.kws button{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line2);font:500 11.5px/1 var(--font);color:var(--muted)}
.kws button:hover{border-color:var(--accent);color:var(--text)}
.sec h3{font:600 10.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.nbrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nb{display:grid;gap:5px;text-align:left}
.nb .thumb{aspect-ratio:1;border-radius:50%;background-color:#000;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent)}
.nb span{font-size:10.5px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb:hover span{color:var(--text)}
.ins-empty{padding:26px 22px;display:grid;gap:14px;color:var(--muted);line-height:1.65}
.ins-empty h2{font:700 20px var(--head);color:var(--text);letter-spacing:-.015em}
.tips{display:grid;gap:10px}
.tip{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.tip .k{width:34px;height:34px;border-radius:10px;background:var(--hi2);display:grid;place-items:center;color:var(--accent)}
.tip b{color:var(--text);font-weight:600}

/* ---------- floating bits ---------- */
.tooltip{position:fixed;z-index:50;pointer-events:none;display:none;width:260px;padding:10px;border-radius:16px;gap:10px;grid-template-columns:46px 1fr}
.tooltip.is-on{display:grid}
.tooltip .thumb{width:46px;height:46px;border-radius:50%;background-color:#000}
.tooltip b{display:block;font:600 13px/1.3 var(--font);margin-bottom:2px}
.tooltip small{color:var(--faint);font-size:11.5px;display:flex;gap:8px;align-items:center}
.tooltip small i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.bottombar{position:fixed;z-index:25;left:50%;bottom:var(--gap);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;max-width:calc(100vw - 2*var(--gap))}
.bottombar .info{font:500 12px var(--font);color:var(--muted);padding:0 10px;white-space:nowrap}
.bottombar .info b{color:var(--text)}
.bottombar .sep{width:1px;height:22px;background:var(--line2)}
.sel-bar{position:fixed;z-index:28;left:50%;bottom:76px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:9px 12px 9px 18px;border-radius:999px;transition:all .35s var(--ease)}
.sel-bar.is-on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sel-bar b{font:700 13px var(--head)}
.boxsel{position:fixed;z-index:15;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;display:none}
.pop{position:fixed;z-index:60;min-width:270px;border-radius:20px;padding:16px;display:none;gap:14px}
.pop.is-open{display:grid}
.pop h4{font:600 10.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:grid;gap:7px;justify-items:center;padding:10px 6px;border-radius:14px;border:1px solid var(--line);font:600 12px/1 var(--font);color:var(--muted)}
.opt i{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line2) inset;display:grid;place-items:center}
.opt:hover{border-color:var(--line2)}
.opt.is-on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
.pl{display:grid;gap:2px;max-height:300px;overflow:auto}
.pl>div{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:5px;border-radius:10px;cursor:pointer}
.pl>div:hover{background:var(--hi)}
.pl .thumb{width:30px;height:30px;border-radius:50%}
.pl span{font:500 12.5px/1.3 var(--font)}
.pl button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.pl button:hover{background:var(--hi2);color:var(--text)}

/* ---------- layouts ---------- */
html[data-layout="dock"] .lpanel,html[data-layout="dock"] .inspector{top:60px;bottom:0;left:0;border-radius:0;border-width:0 1px 0 0}
html[data-layout="dock"] .inspector{left:auto;right:0;border-width:0 0 0 1px}
html[data-layout="dock"] .top{left:0;right:0;top:0;height:60px;padding:0 var(--gap);background:var(--panel);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);align-items:center}
html[data-layout="dock"] .brand,html[data-layout="dock"] .searchbar,html[data-layout="dock"] .group,html[data-layout="dock"] .pill-btns{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
html[data-layout="dock"] .searchbar{background:var(--hi);border-color:var(--line)}
html[data-layout="focus"] .lpanel{transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none}
html[data-layout="focus"] .inspector{top:auto;bottom:var(--gap);height:auto;max-height:calc(100vh - 150px);width:min(var(--iw),calc(100vw - 28px))}
html[data-layout="focus"] .ins-globe{height:190px}
body.no-sel .inspector.glass{}
.inspector.is-hidden{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
.inspector{transition:transform .5s var(--ease),opacity .3s}
html[data-layout="focus"] .inspector.is-hidden{transform:translateY(calc(100% + 30px))}

/* ---------- responsive ---------- */
@media (max-width:1180px){:root{--pw:270px;--iw:340px}.brand small{display:none}.group>span{display:none}}
@media (max-width:980px){
  .group{display:none}
  .searchbar{max-width:none}
  .lpanel{transform:translateX(calc(-100% - 30px));opacity:0;pointer-events:none;width:min(320px,calc(100vw - 28px))}

    $$('#insSeg button').forEach((b2) => b2.classList.toggle('is-on', b2.dataset.m === app.state.mode));
    $('#gcontrols').innerHTML = info.time.has ? `<button class="play" id="play" aria-label="${app.state.playing ? 'Pause' : 'Play'}">${icon(app.state.playing ? 'pause' : 'play', 14)}</button><div class="scr"><div class="tt"><span>${esc(info.time.start)}</span><b id="tLab">${esc(info.time.label(app.state.t))}</b><span>${esc(info.time.end)}</span></div><input class="sl" id="scrub" type="range" min="0" max="1000" value="${Math.round(app.state.t * 1000)}" style="--p:${app.state.t * 100}%" aria-label="Time"></div>` : `<span style="font:500 11px var(--font);color:var(--muted)">${esc(info.layer.label)} · illustrative</span>`;
    $('#insScroll').innerHTML = `<div><div class="eyebrow" style="--c:${COL[d.cat]}"><i></i>${esc(d.cat)}${d.subs[0] ? ' · ' + esc(d.subs[0]) : ''}</div><h2>${esc(d.name)}</h2></div>
        <div class="pills">${info.platforms.map((p) => `<span class="pill acc">${p.label}</span>`).join('')}${info.flags.map((f2) => `<span class="pill">${icon(f2.icon, 12)}${esc(f2.label)}</span>`).join('')}${info.coverage && !d.rt ? `<span class="pill">${icon('clock', 12)}${esc(info.coverage)}</span>` : ''}</div>
        ${info.legend ? `<div class="legendbar"><div style="display:flex;justify-content:space-between;font:600 11px var(--font);color:var(--muted);margin-bottom:6px"><span>${esc(info.legend.label)}</span><span style="color:var(--faint)">${esc(info.legend.unit)}</span></div><div style="height:8px;border-radius:5px;background:${info.legend.css};box-shadow:0 0 0 1px var(--line) inset"></div><div style="display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--faint);margin-top:4px">${info.legend.ticks.map((x) => `<span>${esc(x.label)}</span>`).join('')}</div></div>` : ''}
        <p class="desc" id="desc">${esc(d.desc)}${d.more ? `<span id="more" hidden> ${esc(d.more)}</span> <button id="tog">Read more</button>` : ''}</p>
        <div class="btns"><button class="btn pri" id="plBtn">${icon(inPl ? 'check' : 'plus', 15)}${inPl ? 'In playlist' : 'Add to playlist'}</button><a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">${icon('external', 14)}sos.noaa.gov</a><button class="btn" id="closeIns" aria-label="Close">${icon('x', 15)}</button></div>
        <dl class="kv"><dt>Added</dt><dd>${esc(info.added)}</dd>${info.coverage ? `<dt>Coverage</dt><dd>${esc(info.coverage)}</dd>` : ''}<dt>Links</dt><dd>${adj[selNode.i].length} connections</dd>${d.themes.length ? `<dt>Themes</dt><dd>${d.themes.map(esc).join(', ')}</dd>` : ''}${info.grade ? `<dt>Grades</dt><dd>${esc(info.grade)}</dd>` : ''}</dl>
        ${d.kw.length ? `<div class="sec"><h3>Keywords</h3><div class="kws">${d.kw.slice(0, 10).map((k) => `<button data-kw="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>` : ''}
        <div class="sec"><h3>Nearest stars</h3><div class="nbrs">${rel.map((r) => `<button class="nb" data-id="${r.id}" style="--c:${COL[r.cat]}" title="${esc(r.name)}">${ui.thumb(r, { size: 'small' })}<span>${esc(r.name)}</span></button>`).join('')}</div></div>`;
    mg.setMode(app.state.mode, { animate: false }); mg.setDataset(d, { fly: true, dur: 1100 }); mg.setTime(app.state.t); mg.setLoop(info.time.loop); mg.play(app.state.playing);
    $('#insScroll').scrollTop = 0;
    focusOn(selNode); requestDraw();
  }
  function syncTime() { const d = app.selected; const s = $('#scrub'); if (!d || !s) return; s.value = Math.round(app.state.t * 1000); s.style.setProperty('--p', app.state.t * 100 + '%'); $('#tLab').textContent = SOS.describe(d).time.label(app.state.t); }
  insp.addEventListener('click', (e) => {
    if (e.target.closest('#closeIns')) return app.select(null);
    const m = e.target.closest('[data-m]'); if (m) { app.set({ mode: m.dataset.m }); mg.setMode(m.dataset.m); $$('#insSeg button').forEach((b) => b.classList.toggle('is-on', b === m)); return; }
    const pl = e.target.closest('#play'); if (pl) { app.set({ playing: !app.state.playing }); mg.play(app.state.playing); pl.innerHTML = icon(app.state.playing ? 'pause' : 'play', 14); return; }
    if (e.target.closest('#plBtn')) { const on = store.playlist.toggle(app.selected.id); ui.toast(on ? 'Added to playlist' : 'Removed'); return; }
    const tg = e.target.closest('#tog'); if (tg) { const mo = $('#more'); mo.hidden = !mo.hidden; tg.textContent = mo.hidden ? 'Read more' : 'Show less'; return; }
    const kw = e.target.closest('[data-kw]'); if (kw) { qEl.value = kw.dataset.kw; $('#qx').hidden = false; app.set({ q: kw.dataset.kw, sort: 'rel' }); return; }
    const nb = e.target.closest('.nb'); if (nb) { app.select(+nb.dataset.id); }
  });
  insp.addEventListener('input', (e) => { if (e.target.id === 'scrub') { const t = +e.target.value / 1000; e.target.style.setProperty('--p', t * 100 + '%'); app.set({ t, playing: false }); mg.play(false); mg.setTime(t); const d = app.selected; $('#tLab').textContent = SOS.describe(d).time.label(t); const pb = $('#play'); if (pb) pb.innerHTML = icon('play', 14); } });

  /* ---------- popovers ---------- */
  let openPop = null;
  function togglePop(pop, anchor, on) {
    const show = on != null ? on : !pop.classList.contains('is-open');
    $$('.pop').forEach((p) => p.classList.remove('is-open')); $$('.pill-btns .icon-btn').forEach((b) => b.classList.remove('is-on')); openPop = null;
    if (show) { const r = anchor.getBoundingClientRect(); pop.style.top = r.bottom + 10 + 'px'; pop.style.right = Math.max(10, innerWidth - r.right) + 'px'; pop.style.left = 'auto'; pop.classList.add('is-open'); anchor.classList.add('is-on'); openPop = pop; }
  }
  $('#btnPl').addEventListener('click', (e) => { e.stopPropagation(); renderPl(); togglePop($('#popPl'), $('#btnPl')); });
  $('#btnLook').addEventListener('click', (e) => { e.stopPropagation(); renderLook(); togglePop($('#popLook'), $('#btnLook')); });
  document.addEventListener('click', (e) => { if (openPop && !openPop.contains(e.target)) togglePop(openPop, null, false); });
  function renderPl() { const it = store.playlist.items; $('#popPl').innerHTML = `<div><h4>Playlist · ${it.length}</h4>${it.length ? `<div class="pl">${it.map((d) => `<div data-id="${d.id}">${ui.thumb(d, { size: 'small' })}<span>${esc(d.name)}</span><button data-rm="${d.id}" aria-label="Remove ${esc(d.name)}">${icon('x', 13)}</button></div>`).join('')}</div>` : `<p style="color:var(--muted);line-height:1.6">Empty. Add stars from the inspector, or shift-drag to box-select several.</p>`}</div>${it.length ? '<button class="btn" id="plClr">Clear playlist</button>' : ''}`; }
  $('#popPl').addEventListener('click', (e) => { const rm = e.target.closest('[data-rm]'); if (rm) { e.stopPropagation(); return store.playlist.remove(+rm.dataset.rm); } if (e.target.closest('#plClr')) return store.playlist.clear(); const it = e.target.closest('[data-id]'); if (it) { app.select(+it.dataset.id); togglePop(openPop, null, false); } });
  store.playlist.onChange(() => { $('#plN').textContent = store.playlist.size || ''; $('#plN').dataset.n = store.playlist.size; renderPl(); const b = $('#plBtn'); if (b && app.selected) { const on = store.playlist.has(app.selected.id); b.innerHTML = icon(on ? 'check' : 'plus', 15) + (on ? 'In playlist' : 'Add to playlist'); } });
  function renderLook() {
    const T = html.getAttribute('data-theme'), L = html.getAttribute('data-layout');
    $('#popLook').innerHTML = `<div><h4>Theme</h4><div class="opts3">${[['indigo', 'Indigo', 'radial-gradient(circle at 35% 30%,#8f9dff,#101845 70%)'], ['nebula', 'Nebula', 'radial-gradient(circle at 35% 30%,#ffb347,#ff7ac3 45%,#2a0f3a)'], ['chalk', 'Chalk', 'radial-gradient(circle at 35% 30%,#fff,#e9e4d6)']].map(([id, n, bg]) => `<button class="opt ${T === id ? 'is-on' : ''}" data-theme-pick="${id}"><i style="background:${bg}"></i>${n}</button>`).join('')}</div></div>
      <div><h4>Layout</h4><div class="opts3">${[['float', 'Floating', 'panel'], ['dock', 'Docked', 'columns'], ['focus', 'Focus', 'single']].map(([id, n, ic]) => `<button class="opt ${L === id ? 'is-on' : ''}" data-layout-pick="${id}"><i style="box-shadow:none">${icon(ic, 22)}</i>${n}</button>`).join('')}</div></div>`;
  }
  $('#popLook').addEventListener('click', (e) => {
    const t = e.target.closest('[data-theme-pick]'); if (t) { themeSw.apply(t.dataset.themePick); readColors(); if (mg) mg.themeFromCSS(html); renderLeft(); requestDraw(); renderLook(); return; }
    const l = e.target.closest('[data-layout-pick]'); if (l) { html.setAttribute('data-layout', l.dataset.layoutPick); P.layout = l.dataset.layoutPick; prefs.set(P); renderLook(); setTimeout(() => { fit(true); if (mg) mg._resize(); }, 80); }
  });

  /* ---------- wiring ---------- */
  app.subscribe((patch) => {
    const keys = Object.keys(patch);
    if (keys.some((k) => !['sel', 'mode', 'proj', 'playing', 't', 'opacity', 'view'].includes(k))) { computeMatch(); renderLeft(); }
    if ('sel' in patch) { $$('.ri').forEach((r) => r.classList.toggle('is-sel', +r.dataset.id === app.state.sel)); }
  });
  // No big globe on this page — bind selection manually to the inspector
  let lastSel;
  app.subscribe(() => { if (app.state.sel !== lastSel) { lastSel = app.state.sel; const d = app.selected; renderInspector(d, d ? SOS.describe(d) : null); } });
  window.addEventListener('resize', SOS.debounce(() => fit(true), 150));

  /* ---------- boot ---------- */
  if (qGroup && GROUPS.some((g) => g[0] === qGroup)) P.group = qGroup;
  renderGroups(); html.setAttribute('data-group', P.group);
  computeMatch(); renderLeft(); renderPl();
  $('#plN').textContent = store.playlist.size || ''; $('#plN').dataset.n = store.playlist.size;
  applyGroup(P.group);
  // warm the layout so first paint is already settled
  for (let i = 0; i < 160 && ticking; i++) tick(); fit(false);
  const fromHash = app.selectFromHash(); if (fromHash) { app.state.sel = null; app.select(fromHash.id, { noHash: true }); }
  window.__constellation = { app, nodes, cam, fit, setGroup, settle: (n = 300) => { for (let i = 0; i < n && ticking; i++) tick(); fit(false); requestDraw(); } };
})();
</script>
</body>
</html>
